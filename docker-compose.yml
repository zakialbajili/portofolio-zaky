services:
  nextjs-app:
    container_name: portofolio-zaky
    build: .
    expose:
      - "${PORT}"
    environment:
      HOSTNAME: "${HOSTNAME}"
      PORT: ${PORT}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    restart: always
    networks:
      - infra
    volumes:
      - ./data:/app/data
    env_file:
      - .env

networks:
  infra:
    external: true
